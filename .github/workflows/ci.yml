name: Maven CI

on:
  schedule:
    - cron: '42 0 * * 1'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: ${{ !startsWith(github.event_name, 'pull_request') }}
      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        if: ${{ github.event_name != 'release' }}
        uses: github/codeql-action/init@v4
        with:
          languages: java
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          problem-matcher: true
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B -V -e -Dstyle.color=always clean verify
      - name: Publish Test Report
        if: ${{ (success() || failure()) && github.event_name == 'pull_request' }}
        uses: ScalableCapital/action-surefire-report@v2
        with:
          report_paths: "**/target/*-reports/TEST-*.xml"
      - name: Unittest Coverage
        if: ${{ github.event_name != 'release' }}
        run: >
          mvn -B -Dstyle.color=always jacoco:report
      - name: Unittest Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Integrationstest Coverage
        if: ${{ github.event_name != 'release' }}
        run: >
          mvn -B -Dstyle.color=always jacoco:report-integration@report-integration
      - name: Integrationstest Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Perform CodeQL Analysis
        if: ${{ github.event_name != 'release' }}
        uses: github/codeql-action/analyze@v4
      - name: Sonar Report
        if: ${{ !startsWith(github.event_name, 'pull_request') || !github.event.pull_request.head.repo.fork }}
        run: >
          mvn -B -e -Dstyle.color=always jacoco:report jacoco:report-integration@report-integration sonar:sonar -Dsonar.organization=jonasrutishauser-github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Upload test results to Codecov
        if: ${{ github.event_name != 'release' }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
