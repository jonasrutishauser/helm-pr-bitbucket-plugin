name: Maven CI

on:
  schedule:
    - cron: '42 0 * * 1'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published

permissions:
  checks: write
  contents: write
  security-events: write

jobs:
  build:
    uses: jonasrutishauser/parent/.github/workflows/common-ci.yml@5978e8d788d355fd9c2892d914502cb4cbb73bf8 # v45
    with:
      java-versions: '["21"]'
      publish-coverage-report: true
      sonar-report: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
